name: Update builds data

on:
  schedule:
    - cron: "23 */2 * * *"     # кожні 2 години
  workflow_dispatch:            # кнопка «Run workflow» для ручного запуску

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Compute builds for all heroes
        run: python server/precompute.py out

      - name: Publish to the "data" branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds.json
          git commit -q -m "builds $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
