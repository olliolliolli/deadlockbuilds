name: Build exe

on:
  push:
    branches: [main, master]
    paths: ["dlbuilds/**", "app.py", ".github/workflows/build-exe.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyinstaller PySide6-Essentials requests

      - name: Embed the data URL of this repository
        shell: bash
        run: |
          echo "DATA_URL = \"https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/builds.json\"" > dlbuilds/_build_info.py
          echo "VERSION = \"$(date -u +%m%d)-${GITHUB_SHA::7}\"" >> dlbuilds/_build_info.py

      - name: Build DeadlockBuilds.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name DeadlockBuilds
          --exclude-module tkinter --exclude-module unittest
          app.py

      - name: Publish release "latest"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Автоматична збірка від $(date -u +%Y-%m-%d) (${GITHUB_SHA::7}). Завантаж DeadlockBuilds.exe нижче."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/DeadlockBuilds.exe --clobber
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest dist/DeadlockBuilds.exe --title "DeadlockBuilds" --notes "$NOTES"
          fi
